<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171522">
<title>Капитошки: В гостях у сказки</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#171522;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;touch-action:pan-y}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;
 padding:max(8px,env(safe-area-inset-top)) 8px 6px}
#picture{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
 pointer-events:none;user-select:none;-webkit-user-drag:none}
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;overflow:hidden;padding:max(4vh,24px) max(20px,env(safe-area-inset-right)) max(5vh,24px) max(20px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 24%,#fff2c6 0%,#f6b86e 24%,transparent 55%),radial-gradient(ellipse at 12% 78%,#65d6c5 0%,transparent 42%),radial-gradient(ellipse at 88% 72%,#9d8bea 0%,transparent 45%),linear-gradient(145deg,#193c67 0%,#315f91 48%,#553c78 100%);color:#fff;font-size:17px}
#loader[hidden]{display:none}
#loader:before,#loader:after{content:"";position:absolute;width:130vw;height:34vh;bottom:-17vh;background:radial-gradient(ellipse,#ffe2a855,transparent 68%)}
#loader:before{width:min(105vw,900px);aspect-ratio:1;border:1px solid #fff4;box-shadow:0 0 0 32px #ffffff0b,0 0 90px #ffe4a655;top:10%;left:50%;transform:translateX(-50%)}
#loader:after{content:"";position:absolute;width:min(120vw,900px);height:45vh;bottom:-27vh;background:radial-gradient(ellipse,#8de9ff55,transparent 68%)}
.loader-spark{position:absolute;color:#fff3a0;text-shadow:0 0 14px #fff;animation:twinkle 2.2s ease-in-out infinite}
.loader-spark.one{top:12%;left:13%;font-size:clamp(22px,5vw,42px)}
.loader-spark.two{top:20%;right:14%;font-size:clamp(16px,4vw,32px);animation-delay:.7s}
.loader-spark.three{bottom:19%;left:19%;font-size:clamp(14px,3vw,26px);animation-delay:1.2s}
#loaderLogo{position:relative;z-index:1;display:block;width:min(88vw,760px);max-height:70vh;object-fit:contain;filter:drop-shadow(0 16px 24px #101c3d88);animation:logo-arrive .8s cubic-bezier(.2,.8,.2,1) both;flex:0 1 auto;margin-top:auto}
.loader-caption{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:13px;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 10px #142b50;margin-top:auto;margin-bottom:1vh}
.loader-caption span{font-size:clamp(16px,3.8vw,21px)}
.loader-track{width:min(230px,58vw);height:8px;border-radius:99px;background:#ffffff55;overflow:hidden;box-shadow:0 2px 14px #101c3d66,inset 0 1px 3px #183d7055}
.loader-track:after{content:"";display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#fff3a0,#fff);animation:loading 1.35s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.18)}}
@keyframes logo-arrive{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(orientation:landscape){#loader{padding-top:3vh;padding-bottom:3vh}#loaderLogo{width:min(62vw,650px);max-height:66vh}.loader-caption{gap:8px;margin-bottom:0}}
@media(prefers-reduced-motion:reduce){#loaderLogo,.loader-spark,.loader-track:after{animation:none}}
.controls{flex:none;width:100%;padding:7px 0 max(8px,env(safe-area-inset-bottom));
 display:flex;flex-direction:column;align-items:stretch;gap:8px;background:#171522}
#audioPlayer{display:none}
#audioPlayer[hidden],#downloadAudio[hidden],#playAudio[hidden],#audioProgress[hidden],#audioTime[hidden]{display:none}
.audio-progress-row{display:flex;align-items:center;width:100%;padding:0 14px}
#audioProgress{display:block;width:100%;height:6px;accent-color:#a995d8;cursor:pointer}
.navigation{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;padding:0 10px;min-height:48px}
.audio-controls{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.audio-controls[hidden]{display:none}
#playAudio,#downloadAudio{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:40px;
 border:0;border-radius:13px;background:#51446f;color:#fff;text-decoration:none;font-size:21px;font-weight:700;
 box-shadow:0 3px 0 #302843;cursor:pointer}
#playAudio:active,#downloadAudio:active{transform:translateY(2px);box-shadow:0 1px 0 #302843}
#audioTime{min-width:76px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:#ddd}
button{border:0;color:#fff;background:#51446f;border-radius:16px;width:64px;height:48px;
 font-size:29px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 #302843;flex:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #302843}
button:disabled{opacity:.3;cursor:default}
@media(orientation:landscape){
 .controls{padding-top:4px;gap:5px}
 #playAudio,#downloadAudio{height:36px;width:40px}
 #audioTime{min-width:68px;font-size:11px}
 .audio-controls{gap:6px}
 button{height:40px;width:58px}
}
</style>
</head>

    <input id="audioProgress" type="range" min="0" max="1000" value="0" hidden aria-label="Позиция воспроизведения">
  </div>
  <audio id="audioPlayer" preload="metadata"></audio>
  <div class="navigation">
    <button id="previous" type="button" aria-label="Предыдущая картинка">‹</button>
    <div class="audio-controls" id="audioControls" hidden>
      <button id="playAudio" type="button" aria-label="Воспроизвести" title="Воспроизвести">▶</button>
      <span id="audioTime">0:00 / 0:00</span>
      <a id="downloadAudio" href="#" download aria-label="Скачать аудиофайл" title="Скачать аудиофайл">
        <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/>
        </svg>
      </a>
    </div>
    <button id="next" type="button" aria-label="Следующая картинка">›</button>
  </div>

<script>
(() => {
  'use strict';
  // Файлы: resources/01.jpeg, resources/02.jpeg ...;
  // аудио: resources/01.mp3, resources/02.mp3 ...
  // Страницы автоматически находятся по последовательной нумерации.
  const folder = 'resources/';
  const extensions = ['jpeg', 'jpg', 'png'];
  const pages = [];
  let current = 0;
  let scanNumber = 1;

  const picture = document.getElementById('picture');
  const loader = document.getElementById('loader');
  const player = document.getElementById('audioPlayer');
  const downloadAudio = document.getElementById('downloadAudio');
  const playAudio = document.getElementById('playAudio');
  const audioProgress = document.getElementById('audioProgress');
  const audioTime = document.getElementById('audioTime');
  const audioControls = document.getElementById('audioControls');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const pad = n => String(n).padStart(2, '0');

  function findImage(number) {
    return new Promise(resolve => {
      let extIndex = 0;
      const tryNext = () => {
        if (extIndex >= extensions.length) { resolve(null); return; }
        const path = folder + pad(number) + '.' + extensions[extIndex++];
        const probe = new Image();
        probe.onload = () => resolve(path);
        probe.onerror = tryNext;
        probe.src = path;
      };
      tryNext();
    });
  }

  async function discoverPages() {
    // Идём по порядку и завершаем поиск на первом отсутствующем номере.
    // Это позволяет просто добавлять новые файлы в resources.
    while (scanNumber <= 999) {
      const path = await findImage(scanNumber);
      if (!path) break;
      pages.push({ number: scanNumber, image: path });
      scanNumber++;
    }
    if (!pages.length) {
      picture.alt = 'В папке resources не найдены картинки';
      previous.hidden = next.hidden = true;
      loader.innerHTML = '<div>В папке resources не найдены картинки</div>';
      return;
    }
    showPage(0);
  }

  function showPage(index) {
    current = Math.max(0, Math.min(pages.length - 1, index));
    const page = pages[current];
    picture.onload = () => { loader.hidden = true; };
    picture.onerror = () => { loader.hidden = true; };
    picture.src = page.image;
    // На первой и последней страницах ненужную кнопку полностью скрываем.
    previous.hidden = current === 0;
    next.hidden = current === pages.length - 1;
    // Если видна только одна кнопка, прижимаем её к соответствующему краю.
    next.style.marginLeft = current === 0 ? 'auto' : '';
    previous.style.marginRight = current === pages.length - 1 ? 'auto' : '';

    // Сначала полностью сбрасываем предыдущую дорожку.
    player.pause();
    player.removeAttribute('src');
    player.load();
    audioControls.hidden = audioProgress.hidden = true;
    playAudio.textContent = '▶';
    playAudio.setAttribute('aria-label', 'Воспроизвести');
    audioProgress.value = 0;
    audioTime.textContent = '0:00 / 0:00';
    downloadAudio.hidden = true;
    downloadAudio.removeAttribute('href');

    const audioPath = folder + pad(page.number) + '.mp3';
    player.onerror = () => {
      player.pause(); player.removeAttribute('src'); player.load();
      audioControls.hidden = audioProgress.hidden = true;
      downloadAudio.hidden = true; downloadAudio.removeAttribute('href');
      audioControls.hidden = true; audioProgress.hidden = true;
    };
    player.onloadedmetadata = () => {
      audioControls.hidden = audioProgress.hidden = false;
      downloadAudio.href = audioPath;
      downloadAudio.download = pad(page.number) + '.mp3';
      downloadAudio.hidden = false;
      updateAudioTime();
    };
    player.src = audioPath;
    player.load();
  }

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '0:00';
    const value = Math.floor(seconds);
    return Math.floor(value / 60) + ':' + String(value % 60).padStart(2, '0');
  }

  function updateAudioTime() {
    audioTime.textContent = formatTime(player.currentTime) + ' / ' + formatTime(player.duration);
    if (Number.isFinite(player.duration) && player.duration > 0) {
      audioProgress.value = String(Math.round(player.currentTime / player.duration * 1000));
    }
  }

  playAudio.addEventListener('click', () => {
    if (player.paused) player.play().catch(() => {});
    else player.pause();
  });
  player.addEventListener('play', () => {
    playAudio.textContent = 'Ⅱ';
    playAudio.setAttribute('aria-label', 'Пауза');
  });
  player.addEventListener('pause', () => {
    playAudio.textContent = '▶';
    playAudio.setAttribute('aria-label', 'Воспроизвести');
  });
  player.addEventListener('timeupdate', updateAudioTime);
  player.addEventListener('loadedmetadata', updateAudioTime);
  audioProgress.addEventListener('input', () => {
    if (Number.isFinite(player.duration) && player.duration > 0) {
      player.currentTime = Number(audioProgress.value) / 1000 * player.duration;
      updateAudioTime();
    }
  });

  previous.addEventListener('click', () => showPage(current - 1));
  next.addEventListener('click', () => showPage(current + 1));
  document.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft') showPage(current - 1);
    if (event.key === 'ArrowRight') showPage(current + 1);
  });
  document.addEventListener('selectstart', event => event.preventDefault());
  document.addEventListener('dragstart', event => event.preventDefault());

  discoverPages();
})();
</script>
</body>
</html>
