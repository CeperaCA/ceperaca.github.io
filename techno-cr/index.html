<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b111b"><title>Техно-ЦР · Играть</title><link rel="stylesheet" href="./style.css"><script src="./boot.js"></script><script defer src="./game-client.js"></script></head><body data-role="player" data-static="true"><div class="phone"><header><div class="brand"><span class="brand-icon">ТЦ</span><span>ТЕХНО-ЦР<small>ИНТЕЛЛЕКТУАЛЬНЫЙ ОБМАН</small></span></div><span id="network" class="status">Подключение…</span></header><main><div class="eyebrow">БРЕДОВУХА</div><h1 id="title">Убедительно.<br>Неправда.</h1><p id="subtitle">Придумайте ложь, в которую поверят остальные.</p><div id="error" class="error" role="alert" hidden></div><section id="join-form" class="card"><form id="join"><label>Адрес игрового сервера<input name="server" type="url" required placeholder="Из ссылки организатора" autocomplete="off"></label><label>Код комнаты<input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="off"></label><label>Ваше имя<input name="name" required maxlength="24" placeholder="Как вас называть?" autocomplete="nickname"></label><button class="primary" type="submit">Войти в игру <span>→</span></button></form></section><section id="stage" aria-live="polite"></section><p class="muted phone-note">4–10 игроков · Один настоящий ответ</p></main></div></body></html>
