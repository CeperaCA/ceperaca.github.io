<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторский каталог стикеров</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
    <header class="header">
        <h1>Авторский каталог стикеров</h1>
    </header>

    <main id="app"></main>

    <footer class="footer">
        <button type="button" id="authorLink" class="author-link">
            <svg class="author-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5z" fill="currentColor"/>
            </svg>
            <span>Автор</span>
        </button>
    </footer>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button type="button" class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalStickers" class="sticker-grid"></div>
            <button type="button" id="addSetBtn" class="btn-add">Добавить набор</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
